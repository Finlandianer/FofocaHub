<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="css/TelaInicial.css">

    <link

        stroke-width="2"

        stroke-linejoin="round"

    >
        <path d="M12 19V5"/>
        <path d="m5 12 7-7 7 7"/>
    </svg>
</button>

        </form>

    </div>

    <main>

            </div>
            <br>
            <div class="conteudo">
                <img src="img/eletrodomesticos.webp" alt="eletrodomesticos">
